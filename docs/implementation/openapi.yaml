                enum:
                - bytes
              description: bytes。
              required: true
            ETag:
              schema:
                $ref: '#/components/schemas/ETag'
              description: 该版本完整文件字节的强 ETag。
              required: true
            Content-Length:
              schema:
                type: integer
                minimum: 0
                maximum: 9007199254740991
              description: 本次实际响应字节数。
              required: true
            Content-Range:
              schema:
                type: string
              description: bytes start-end/total。
              required: true
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '412':
          $ref: '#/components/responses/Error412'
        '416':
          $ref: '#/components/responses/Error416'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
        '507':
          $ref: '#/components/responses/Error507'
      parameters:
      - $ref: '#/components/parameters/UnitId'
      - $ref: '#/components/parameters/RelativePath'
      - $ref: '#/components/parameters/SnapshotQuery'
      - $ref: '#/components/parameters/Range'
      - $ref: '#/components/parameters/IfMatch'
  /units/{unitId}/holds/{holdId}:
    put:
      operationId: acquireHold
      tags:
      - 归档保留
      summary: 核验版本并登记持久保留引用
      description: 要求 managed+sync，holdId 由客户端先持久保存，绑定单元、设备和请求。NAS 确认范围存在，按存储规范核实所需数据完整可读，事务中建立保留引用。根目录 path 为空，v1 可保守保护整份快照，包含引用的附件与固定子版本；跨单元目标也要有相应授权。收到
        active 后本机才能继续执行回收步骤。重复同参返回相同记录，异参或试图复用 released ID 返回 409。
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hold'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
        '507':
          $ref: '#/components/responses/Error507'
      parameters:
      - $ref: '#/components/parameters/UnitId'
      - $ref: '#/components/parameters/HoldId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HoldSpec'
            example:
              snapshotId: 01ARZ3NDEKTSV4RRFFQ69G5FA2
              path: ''
    get:
      operationId: getHold
      tags:
      - 归档保留
      summary: 查验当前设备的归档保留记录
      description: 用于回收中断恢复。当前设备需仍有单元权限；设备撤销不自动删除长期保留引用，本机管理员可管理孤立引用。
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hold'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - $ref: '#/components/parameters/UnitId'
      - $ref: '#/components/parameters/HoldId'
    delete:
      operationId: releaseHold
      tags:
      - 归档保留
      summary: 解除当前设备创建的引用
      description: 用户主动解除长期保留时使用；客户端先确认仍需保留的版本已有对应持久副本或其他引用。成功记录 released 墓碑，后续相同请求仍返回 204。操作与桌面释放本机空间相互独立；释放本机空间需要 acquireHold。
      responses:
        '204':
          description: 已解除。
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
        '507':
          $ref: '#/components/responses/Error507'
      parameters:
      - $ref: '#/components/parameters/UnitId'
      - $ref: '#/components/parameters/HoldId'
components:
  securitySchemes:
    deviceBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque device secret
  parameters:
    UnitId:
      name: unitId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
      description: unitId
    UploadId:
      name: uploadId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
      description: uploadId
    SnapshotId:
      name: snapshotId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
      description: snapshotId
    HoldId:
      name: holdId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
      description: holdId
    Digest:
      name: digest
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Digest'
      description: 原始对象字节的 SHA-256。
    ObjectKind:
      name: kind
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/ObjectKind'
      description: 同一摘要可用作不同类型，类型和摘要共同标识对象。
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Cursor'
      description: 上一页的 nextCursor；changes 使用上次已完整应用的 cursor。
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 256
        default: 100
      description: 最大条数。
    RelativePath:
      name: path
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/Path'
      description: UTF-8 相对路径，根目录使用 ?path=。
      allowEmptyValue: true
    SnapshotQuery:
      name: snapshotId
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Id'
      description: managed 必传不可变快照 ID；external 省略。
    Range:
      name: Range
      in: header
      required: false
      schema:
        type: string
        pattern: ^bytes=([0-9]+-[0-9]*|-[0-9]+)$
      description: 单范围，单位字节。
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema:
        $ref: '#/components/schemas/ETag'
      description: 从上次响应获取的强实体标记，恢复中断读取必须携带。
    From:
      name: from
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/Id'
      description: 基线快照。
    To:
      name: to
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/Id'
      description: 目标快照。
    ReadKinds:
      name: kind
      in: query
      required: false
      schema:
        type: string
        enum:
        - all
        - published
        - fork
      description: 默认 all。
    AttachmentName:
      name: name
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-][A-Za-z0-9._-]*$
        maxLength: 255
      description: 本快照内唯一的附件名，单一 ASCII 段。
  responses:
    Error400:
      description: BAD_REQUEST
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Error401:
      description: UNAUTHENTICATED
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Error403:
      description: FORBIDDEN
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Error404:
      description: NOT_FOUND
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Error409:
      description: CONFLICT / PARENT_MISSING / OBJECTS_MISSING / DIRECTORY_CHANGED
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Error410:
      description: CURSOR_EXPIRED 表示需从头列举可见状态，包括权限变化或授权范围内的历史删除。SESSION_EXPIRED 表示上传会话已过期。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Error412:
      description: SOURCE_CHANGED
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Error413:
      description: TOO_LARGE
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Error416:
      description: RANGE_INVALID
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
      headers:
        Content-Range:
          schema:
            type: string
          description: bytes */完整大小。
          required: true
    Error422:
      description: INVALID_OBJECT
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Error429:
      description: RATE_LIMITED
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
      headers:
        Retry-After:
          schema:
            type: string
          description: 建议的等待秒数。
          required: false
    Error500:
      description: INTERNAL
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Error503:
      description: VOLUME_UNAVAILABLE
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
      headers:
        Retry-After:
          schema:
            type: string
          description: 建议的等待秒数。
          required: false
    Error507:
      description: INSUFFICIENT_SPACE
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    Id:
      type: string
      pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
      description: 大写 Crockford Base32 ULID。
    Digest:
      type: string
      pattern: ^[0-9a-f]{64}$
      description: SHA-256 原始字节的小写十六进制。
    ETag:
      type: string
      pattern: ^"[0-9a-f]{64}"$
      description: 强实体标记。HTTP 头包含一对双引号。
    Cursor:
      type: string
      minLength: 1
      maxLength: 2048
    Path:
      type: string
      description: 原始相对路径，根为空串。组件约束见协议说明。
    ByteCount:
      type: integer
      minimum: 0
      maximum: 9007199254740991
    UnitKind:
      type: string
      enum:
      - managed
      - external
    Role:
      type: string
      enum:
      - reader
      - sync
    ObjectKind:
      type: string
      enum:
      - chunk
      - file
      - tree
    RequestId:
      $ref: '#/components/schemas/Id'
    ObjectRef:
      type: object
      additionalProperties: false
      properties:
        kind:
          $ref: '#/components/schemas/ObjectKind'
        digest:
          $ref: '#/components/schemas/Digest'
      required:
      - kind
      - digest
    Offer:
      type: object
      additionalProperties: false
      properties:
        kind:
          $ref: '#/components/schemas/ObjectKind'
        digest:
          $ref: '#/components/schemas/Digest'
        size:
          type: integer
          minimum: 0
          maximum: 4194304
      required:
      - kind
      - digest
      - size
    Link:
      type: object
      additionalProperties: false
      properties:
        mountPath:
          $ref: '#/components/schemas/Path'
        unitId:
          $ref: '#/components/schemas/Id'
        snapshotId:
          $ref: '#/components/schemas/Id'
      required:
      - mountPath
      - unitId
      - snapshotId
    Attachment:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
          - git-bundle
        name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^[A-Za-z0-9_-][A-Za-z0-9._-]*$
        fileDigest:
          $ref: '#/components/schemas/Digest'
      required:
      - kind
      - name
      - fileDigest
    ApiError:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
          - BAD_REQUEST
          - UNAUTHENTICATED
          - FORBIDDEN
          - NOT_FOUND
          - CONFLICT
          - PARENT_MISSING
          - OBJECTS_MISSING
          - DIRECTORY_CHANGED
          - SESSION_EXPIRED
          - CURSOR_EXPIRED
          - SOURCE_CHANGED
          - TOO_LARGE
          - RANGE_INVALID
          - INVALID_OBJECT
          - RATE_LIMITED
          - INTERNAL
          - VOLUME_UNAVAILABLE
          - INSUFFICIENT_SPACE
        message:
          type: string
        action:
          type: string
          enum:
          - fix_request
          - reauthenticate
          - stop
          - retry
          - upload_missing
          - upload_parent
          - restart_session
          - relist
          - refresh_source
          - wait_for_space
        missing:
          type: array
          items:
            $ref: '#/components/schemas/ObjectRef'
          maxItems: 256
      required:
      - code
      - message
      - action
      description: 400 输入；401 无凭据、设备撤销或配对失败；403 角色不足；404 资源不存在或不在授权范围；409 幂等键复用、父快照未发布、闭包不完整或目录改变；410 游标/会话过期；412 If-Match
        已过期；413 大小超限；416 单范围无效；422 内容摘要或清单结构不符；429 限流；500 内部错误；503 卷不可用；507 空间不足。缺项分页通过重复协商/补齐实现。客户端依据 action 选择重试策略，重试保持原幂等键。
    PairRequest:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 20
          maxLength: 128
          writeOnly: true
        deviceId:
          $ref: '#/components/schemas/Id'
        deviceName:
          type: string
          minLength: 1
          maxLength: 100
        token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          writeOnly: true
          description: 客户端在系统密钥存储生成的 32 随机字节，按无填充 base64url 编码。
      required:
      - code
      - deviceId
      - deviceName
      - token
    PairResult:
      type: object
      additionalProperties: false
      properties:
        deviceId:
          $ref: '#/components/schemas/Id'
        canCreateUnits:
          type: boolean
      required:
      - deviceId
      - canCreateUnits
    HistoryPolicy:
      type: object
      required: [mode, value]
      properties:
        mode: {type: string, enum: [all, latest, days]}
        value: {type: integer}
      oneOf:
      - properties: {mode: {const: all}, value: {const: 0}}
      - properties: {mode: {const: latest}, value: {minimum: 1, maximum: 10000}}
      - properties: {mode: {const: days}, value: {minimum: 1, maximum: 3650}}
      description: all 保留全部。latest 按 NAS 提交顺序计数，当前主线占一项，活动保留和未合并分叉得到额外保护。days 按 NAS 提交时间和滚动 24 小时计算。
    HistoryPolicyInput:
      allOf:
      - {$ref: '#/components/schemas/HistoryPolicy'}
      - type: object
        properties:
          expectedHead:
            anyOf: [{$ref: '#/components/schemas/Id'}, {const: ''}]
            description: 可选的当前主线校验值。空资料库使用空字符串。
      unevaluatedProperties: false
    HistoryPolicyPreview:
      allOf:
      - {$ref: '#/components/schemas/HistoryPolicy'}
      - type: object
        required: [protectedCount, removeCount, head]
        properties:
          protectedCount: {type: integer, minimum: 0, description: 当前主线、活动保留及未合并分叉去重后的总数。}
          removeCount: {type: integer, minimum: 0, description: 按预览时状态应用此规则会从时间线移除的点数。}
          head: {anyOf: [{$ref: '#/components/schemas/Id'}, {const: ''}]}
    TimelineSelection:
      type: object
      required: [snapshotId, expectedHead]
      properties:
        snapshotId: {$ref: '#/components/schemas/Id'}
        expectedHead: {$ref: '#/components/schemas/Id'}
    TimelineDeleteInput:
      allOf:
      - {$ref: '#/components/schemas/TimelineSelection'}
      - type: object
        required: [planToken]
        properties:
          planToken: {$ref: '#/components/schemas/Digest'}
      unevaluatedProperties: false
    TimelineRestoreInput:
      allOf:
      - {$ref: '#/components/schemas/TimelineSelection'}
      - type: object
        required: [requestId]
        properties:
          requestId: {$ref: '#/components/schemas/Id'}
          label: {type: string, maxLength: 500, default: ''}
      unevaluatedProperties: false
    RebuiltTimelinePoint:
      type: object
      required: [snapshotId, label, parentsBefore, parentsAfter]
      properties:
        snapshotId: {$ref: '#/components/schemas/Id'}
        label: {type: string}
        parentsBefore: {type: array, items: {$ref: '#/components/schemas/Id'}}
        parentsAfter: {type: array, items: {$ref: '#/components/schemas/Id'}}
    TimelineDeletePreview:
      allOf:
      - {$ref: '#/components/schemas/TimelineSelection'}
      - type: object
        required: [planToken, rebuiltPoints]
        properties:
          planToken:
            anyOf: [{$ref: '#/components/schemas/Digest'}, {const: ''}]
            description: 用于提交该次删除的计划编号。受保护的时间点返回空字符串。
          protectedReason: {type: string, description: 保护当前时间点的原因，出现时不能提交本次删除。}
          rebuiltPoints: {type: array, items: {$ref: '#/components/schemas/RebuiltTimelinePoint'}}
    TimelineDeleteReceipt:
      type: object
      required: [snapshotId, deleted, rebuiltPoints]
      properties:
        snapshotId: {$ref: '#/components/schemas/Id'}
        deleted: {const: true}
        rebuiltPoints: {type: array, items: {$ref: '#/components/schemas/RebuiltTimelinePoint'}}
    MergePlan:
      type: object
      required: [unitId, mainHead, branchSnapshotId, baseSnapshotId, alreadyMerged, conflicts, autoPaths]
      properties:
        unitId: {$ref: '#/components/schemas/Id'}
        mainHead: {$ref: '#/components/schemas/Id'}
        branchSnapshotId: {$ref: '#/components/schemas/Id'}
        baseSnapshotId: {type: string, description: 独立根使用空字符串。}
        alreadyMerged: {type: boolean}
        baseHidden: {type: boolean, default: false, description: 共同祖先已从时间线移除。服务端仍按原始祖先计算差异，直接访问祖先的正文或预览返回 404。}
        baseAmbiguous: {type: boolean, description: 有多个最近共同祖先时，差异要求手工选择。}
        autoPaths: {type: array, items: {type: string}}
        conflicts:
          type: array
          items:
            type: object
            required: [path, baseKind, mainKind, branchKind, bothPath, textAllowed]
            properties:
              path: {type: string}
              baseKind: {enum: [file, directory, symlink, missing]}
              mainKind: {enum: [file, directory, symlink, missing]}
              branchKind: {enum: [file, directory, symlink, missing]}
              bothPath: {type: string, description: 保留两份时分叉副本路径；空字符串表示不可选。}
              textAllowed: {type: boolean}
    SharedProject:
      type: object
      required: [unitId, scopeId, key, name, head]
      properties:
        unitId: {$ref: '#/components/schemas/Id'}
        scopeId: {$ref: '#/components/schemas/Id'}
        key: {type: string}
        sourceKey: {type: string}
        name: {type: string}
        head:
          anyOf:
          - {$ref: '#/components/schemas/Id'}
          - {type: 'null'}
        created: {type: boolean}
    Unit:
      type: object
      additionalProperties: false
      properties:
        scopeId: {$ref: '#/components/schemas/Id'}
        projectKey: {type: string}
        unitId:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          minLength: 1
          maxLength: 255
        kind:
          $ref: '#/components/schemas/UnitKind'
        role:
          $ref: '#/components/schemas/Role'
        head:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
      required:
      - unitId
      - name
      - kind
      - role
      - head
    CreateUnit:
      type: object
      additionalProperties: false
      properties:
        requestId:
          $ref: '#/components/schemas/RequestId'
        name:
          type: string
          minLength: 1
          maxLength: 255
      required:
      - requestId
      - name
    UnitPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Unit'
        nextCursor:
          anyOf:
          - $ref: '#/components/schemas/Cursor'
          - type: 'null'
        syncCursor:
          $ref: '#/components/schemas/Cursor'
      required:
      - items
      - nextCursor
      - syncCursor
    SnapshotDraft:
      type: object
      additionalProperties: false
      properties:
        requestId:
          $ref: '#/components/schemas/RequestId'
        clientSnapshotId:
          $ref: '#/components/schemas/Id'
        parentSnapshotId:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        baseContentDigest:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: 本机绑定时已观察到的基线内容指纹。跨设备提交到共享项目时用于核对已有远端父版本；缺少指纹或指纹不符且内容发生变化时保留分叉。
        expectedHead:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        rootDigest:
          $ref: '#/components/schemas/Digest'
        scopeRevision:
          type: integer
          minimum: 1
