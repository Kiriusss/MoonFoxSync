              schema:
                type: string
                format: binary
          headers:
            Accept-Ranges:
              schema:
                type: string
                enum:
                - bytes
              description: bytes。
              required: true
            ETag:
              schema:
                $ref: '#/components/schemas/ETag'
              description: 该版本完整文件字节的强 ETag。
