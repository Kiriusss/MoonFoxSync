openapi: 3.1.0
info:
  title: KiriusDrive 文件与快照 API
  version: 1.0.0
  description: |-
    v1 接口契约。所有链路使用校验服务器身份的 HTTPS。路径相对于 /v1，时间为 RFC 3339 UTC，大小单位为字节；JSON 整数以跨端可精确表示的 2^53−1 为上限。
    本机管理员签发配对码时指定单元和权限。reader 可列出已授权内容、历史及文件正文，sync 还可写入受管单元和取回对应快照的底层对象。每个请求重新核对设备状态、单元授权及资源归属，上传会话与归档记录另绑定创建设备。跨单元相同哈希只允许优化 NAS 内部落盘；协商、发布、对象读取均验证调用者在本单元对内容的引用权。
    路径为区分大小写的原始 UTF-8 相对路径，根目录用空字符串。每段 1–255 个 UTF-8 字节，保留原 Unicode，不允许 NUL、绝对路径、空段、点与双点。URL 查询参数只解码一次。反斜杠是普通 POSIX 名称字符。读取和恢复不跟随符号链接；客户端负责呈现链接和目标端无法表示的路径。快照内目录项以单元、相对路径和快照版本寻址。
    列表游标不透明，绑定设备、权限代次、查询及稳定的分页边界；到达末页 nextCursor=null。分页游标失效重新获取第一页；增量游标失效按 listUnits 的 syncCursor 全量对账。请求默认 JSON，原始对象与文件正文为八位字节流。认证、限流、容量和输入错误见 ApiError 的映射。
servers:
- url: /v1
security:
- deviceBearer: []
tags:
- name: 授权
- name: 资料库
- name: 上传
- name: 历史
- name: 读取
- name: 归档保留
paths:
  /pair:
    post:
      operationId: pairDevice
      tags:
      - 授权
      summary: 兑换一次性配对码
      description: 管理员在 NAS 本机生成至少 128 位随机的一次性配对码，默认 10 分钟有效，指定单元及 reader/sync 权限，并显式授予可选的创建单元能力。客户端使用可信 TLS 连接，将已存入系统密钥库的随机设备令牌送达。服务端在同一事务中消费配对码并保存令牌校验值。响应丢失时可直接用令牌调用
        listUnits 确认；凭据被撤销后返回 401。禁止在日志中记录 code、token、Authorization 和任意原始文件内容。
      responses:
        '201':
          description: 设备已绑定。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairResult'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '409':
          $ref: '#/components/responses/Error409'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairRequest'
      security: []
  /units:
    get:
      operationId: listUnits
      tags:
      - 资料库
      summary: 列出设备可访问的单元
      description: 按 unitId 升序、同一状态边界分页，返回该边界的 syncCursor。全量对账时列完全部单元并固定各单元 head，再从此游标拉增量。external 单元 head=null，目录按需刷新。撤销授权使旧游标失效。
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitPage'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '410':
          $ref: '#/components/responses/Error410'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
    post:
      operationId: createUnit
      tags:
      - 资料库
      summary: 创建受管单元
      description: 要求 NAS 配对时由管理员额外授予 canCreateUnits；成功后设备获得新单元 sync 权限。(deviceId,requestId) 持久绑定请求和结果，重复同参返回相同单元，异参
        409。existing/external 根目录仅 NAS 管理员本地登记。
      responses:
        '201':
          description: 建成或重放原结果。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unit'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
        '507':
          $ref: '#/components/responses/Error507'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUnit'
  /units/{unitId}/projects:
    parameters:
    - $ref: '#/components/parameters/UnitId'
    get:
      operationId: listSharedProjects
      tags: [资料库]
      summary: 列出共享空间的项目
      description: 顶层受管资料库的同步设备可以枚举此空间，游标绑定设备及当前有效权限。
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 共享项目分页。
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/SharedProject'}
                  nextCursor:
                    anyOf:
                    - {$ref: '#/components/schemas/Cursor'}
                    - {type: 'null'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
    post:
      operationId: ensureSharedProject
      tags: [资料库]
      summary: 创建或加入共享项目
      description: 每个空间内 key 唯一。多个设备或重试使用同一 key 时，服务返回已有 unitId 并保留第一次建立的显示名称。子项目沿用该空间的同步授权，管理员显式配置的子项目授权优先。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [key, name]
              properties:
                key: {type: string, pattern: '^[A-Za-z0-9._:-]{1,160}$'}
                sourceKey: {type: string, pattern: '^git:[0-9a-f]{64}$', description: 用于推荐的 Git 来源指纹。}
                name: {type: string, minLength: 1, maxLength: 255}
      responses:
        '200':
          description: 已有项目。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SharedProject'}
        '201':
          description: 新建项目。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SharedProject'}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
  /units/{unitId}/delete-plan:
    parameters:
    - {$ref: '#/components/parameters/UnitId'}
    get:
      operationId: previewLibraryDeletion
      summary: 预览资料库及其子项目的删除范围
      responses:
        '200':
          description: 管理设备可核对名称、范围和确认令牌。
          content:
            application/json:
              schema:
                type: object
                required: [name, units, snapshots, devices, uploads, holds, token]
                properties:
                  name: {type: string}
                  units: {type: integer}
                  snapshots: {type: integer}
                  devices: {type: integer}
                  uploads: {type: integer}
                  holds: {type: integer}
                  token: {type: string}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
  /units/{unitId}/delete:
    parameters:
    - {$ref: '#/components/parameters/UnitId'}
    post:
      operationId: deleteLibrary
      summary: 按预览删除资料库、授权、版本和子项目
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, token]
              properties:
                name: {type: string}
                token: {type: string}
      responses:
        '200':
          description: 数据库事务已提交，独占对象进入后台回收队列。
          content:
            application/json:
              schema:
                type: object
                required: [deleted, units, snapshots]
                properties:
                  deleted: {type: boolean}
                  units: {type: integer}
                  snapshots: {type: integer}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '409': {$ref: '#/components/responses/Error409'}
  /units/{unitId}/history-policy:
    parameters:
    - {$ref: '#/components/parameters/UnitId'}
    get:
      operationId: getHistoryPolicy
      tags: [历史]
      summary: 读取此资料库的保留规则
      description: reader 和 sync 均可读取。初始策略为 all，value 为 0。
      responses:
        '200':
          description: 读取此资料库的保留规则的结果。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HistoryPolicy'}
        '401': {$ref: '#/components/responses/Error401'}
        '404': {$ref: '#/components/responses/Error404'}
        '500': {$ref: '#/components/responses/Error500'}
        '503': {$ref: '#/components/responses/Error503'}
    put:
      operationId: setHistoryPolicy
      tags: [历史]
      summary: 保存并立即应用此资料库的保留规则
      description: 需要 sync 授权。通过 expectedHead 可校验已预览的主线。服务端在同一事务内验证和重建受影响的时间点，再隐藏符合规则的历史。后续发布、合并、恢复与释放保留时会再次执行规则。按天数保留时还会在服务启动后和每 15 分钟检查。已经隐藏的时间点保持隐藏。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HistoryPolicyInput'}
      responses:
        '200':
          description: 保存并立即应用此资料库的保留规则的结果。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HistoryPolicy'}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '409': {$ref: '#/components/responses/Error409'}
        '500': {$ref: '#/components/responses/Error500'}
        '503': {$ref: '#/components/responses/Error503'}
        '507': {$ref: '#/components/responses/Error507'}
  /units/{unitId}/history-policy/preview:
    parameters:
    - {$ref: '#/components/parameters/UnitId'}
    post:
      operationId: previewHistoryPolicy
      tags: [历史]
      summary: 查看保留规则预计移除和保护的时间点数量
      description: 需要 sync 授权。返回本次计算所用的 head，可用作设置策略时的 expectedHead。此请求只读。受保护的时间点在多个条件同时满足时计一次。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HistoryPolicyInput'}
      responses:
        '200':
          description: 查看保留规则预计移除和保护的时间点数量的结果。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HistoryPolicyPreview'}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '409': {$ref: '#/components/responses/Error409'}
        '500': {$ref: '#/components/responses/Error500'}
        '503': {$ref: '#/components/responses/Error503'}
  /units/{unitId}/timeline/delete/preview:
    parameters:
    - {$ref: '#/components/parameters/UnitId'}
    post:
      operationId: previewTimelineDelete
      tags: [历史]
      summary: 查看删除时间点及重建其他时间点的计划
      description: 需要 sync 授权。计划列出每个受影响的可见时间点及重建前后的父版本。若所选点为当前主线、未合并分叉或有活动保留，返回 200 和 protectedReason。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TimelineSelection'}
      responses:
        '200':
          description: 查看删除时间点及重建其他时间点的计划的结果。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TimelineDeletePreview'}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '409': {$ref: '#/components/responses/Error409'}
        '500': {$ref: '#/components/responses/Error500'}
        '503': {$ref: '#/components/responses/Error503'}
  /units/{unitId}/timeline/delete:
    parameters:
    - {$ref: '#/components/parameters/UnitId'}
    post:
      operationId: deleteTimelinePoint
      tags: [历史]
      summary: 提交已预览的时间点删除与重建
      description: 需要 sync 授权。事务内校验主线、保护状态和 planToken。主线或受影响的父关系已有变化时返回 409，客户端须重新预览。服务端验证幸存快照的对象闭包、重建公开父关系并隐藏所选点。原设备重试相同请求可取得原始回执。底层对象、发布记录和原始祖先关系仍保留。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TimelineDeleteInput'}
      responses:
        '200':
          description: 提交已预览的时间点删除与重建的结果。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TimelineDeleteReceipt'}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '409': {$ref: '#/components/responses/Error409'}
        '500': {$ref: '#/components/responses/Error500'}
        '503': {$ref: '#/components/responses/Error503'}
        '507': {$ref: '#/components/responses/Error507'}
  /units/{unitId}/timeline/restore:
    parameters:
    - {$ref: '#/components/parameters/UnitId'}
    post:
      operationId: restoreTimelinePoint
      tags: [历史]
      summary: 从历史树发布一个新的主线时间点
      description: 需要 sync 授权。所选点必须可见且属于该资料库。新快照引用所选点的树和附件，以确认的当前主线为父，并记录 restoredFromSnapshotId。操作只写 NAS。同一设备在此单元内重试相同 requestId 和参数会得到原始回执。使用相同编号提交不同参数或主线变化将返回 409。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TimelineRestoreInput'}
      responses:
        '200':
          description: 从历史树发布一个新的主线时间点的结果。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Receipt'}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '409': {$ref: '#/components/responses/Error409'}
        '500': {$ref: '#/components/responses/Error500'}
        '503': {$ref: '#/components/responses/Error503'}
        '507': {$ref: '#/components/responses/Error507'}
  /units/{unitId}/merge/plan:
    parameters:
    - {$ref: '#/components/parameters/UnitId'}
    post:
      operationId: planMergeFork
      tags: [历史]
      summary: 预览主线与选定分叉的三方树合并
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branchSnapshotId]
              properties:
                branchSnapshotId: {$ref: '#/components/schemas/Id'}
      responses:
        '200':
          description: 可读设备可预览；alreadyMerged 指该分叉已在主线的祖先图中。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MergePlan'}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '409': {$ref: '#/components/responses/Error409'}
  /units/{unitId}/merge/commit:
    parameters:
    - {$ref: '#/components/parameters/UnitId'}
    post:
      operationId: commitMergeFork
      tags: [历史]
      summary: 在已复核主线上发布双父快照
      description: 需要 sync 授权。事务内比较 mainHead，主线变化时返回 409。相同设备与单元的 requestId 持久绑定选择内容，重试返回同一回执。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mainHead, branchSnapshotId, requestId, choices]
              properties:
                mainHead: {$ref: '#/components/schemas/Id'}
                branchSnapshotId: {$ref: '#/components/schemas/Id'}
                requestId: {$ref: '#/components/schemas/Id'}
                label: {type: string, maxLength: 500}
                choices:
                  type: array
                  items:
                    type: object
                    required: [path, choice]
                    properties:
                      path: {type: string}
                      choice: {enum: [main, branch, both, text]}
                      text: {type: string, description: 手工合并 UTF-8 正文最多 128 KiB，无 NUL。}
      responses:
        '200':
          description: 新的双父快照发布回执，重复请求返回原回执。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Receipt'}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '409': {$ref: '#/components/responses/Error409'}
  /units/{unitId}/uploads:
    post:
      operationId: beginUpload
      tags:
      - 上传
      summary: 创建或恢复不可变上传会话
      description: 仅 managed+sync。校验规则与权限。相同 (deviceId,requestId) 冻结同一份请求，重放返回相同状态，参数不同返回 409。clientSnapshotId 须在该单元唯一；过期会话使用新
        requestId 可续用完全相同的快照语义字段与 ID，重新协商缺项；已发布则恢复其回执。规范化请求按字段值比较，省略的默认值与其显式默认值等价，数组顺序是内容的一部分。
      responses:
        '200':
          description: 续用会话或回执。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
        '201':
          description: 已建会话。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '410':
          $ref: '#/components/responses/Error410'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
        '507':
          $ref: '#/components/responses/Error507'
      parameters:
      - $ref: '#/components/parameters/UnitId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SnapshotDraft'
            example:
              requestId: 01ARZ3NDEKTSV4RRFFQ69G5FA1
              clientSnapshotId: 01ARZ3NDEKTSV4RRFFQ69G5FA2
              parentSnapshotId: null
              expectedHead: null
              rootDigest: 7326cd7e8bcace983896e6eb726579fb3bb3c038cc1e20968b0cafb8178422f1
              scopeRevision: 1
              capturedAt: '2026-11-25T02:00:00Z'
              label: 命名检查点
              checkpoint: true
              links: []
              attachments: []
  /uploads/{uploadId}:
    get:
      operationId: getUpload
      tags:
      - 上传
      summary: 获取会话状态和最终回执
      description: 每次请求核实上传者身份与当前单元授权。open 会话最后一次成功会话操作后 7 天到期。finalized 回执在已发布记录或其墓碑中保留，可重复查询。
      responses:
        '200':
          description: 成功。
