      description: managed 必须指定 snapshotId，依有序块返回该快照的文件正文。external 由管理员注册的根目录内解析；使用受限目录句柄并拒绝跟随符号链接。生成可靠的一致源视图（文件系统快照或可验证的不可变临时副本）并取得强
        ETag；无法获得稳定副本则 409。每次响应绑定该视图，续传 external 必须同时带上次 ETag 的 If-Match 和 Range；来源变更返回 412，保持分段下载一致。允许首次 Range 不附 If-Match
        以建立新下载。Range 只支持单区间，越界/多个区间返回 416 和 Content-Range。目录和符号链接没有该文件正文。
