      description: parentSnapshotId 和 expectedHead 相同；首版两者均为 null。串行离线检查点先发布父，再发布子。快照身份为 (unitId, clientSnapshotId)，所有内容字段在该身份下不可变。显式接受并发版本可从最新主线创建合并结果，另以
        resolvedForkSnapshotId 记录来源。scopeRevision 是 (unitId, deviceId) 内的正整数规则标签，允许不同设备复用数值、较旧标签迟到；记录冻结值和清单，无需登记全局修订，权限始终取自
