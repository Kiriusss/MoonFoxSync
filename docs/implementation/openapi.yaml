x-conformance-example:
  name: 空项目的首次发布与回执重试
  preconditions: 已有 managed 空单元，已配对的桌面设备具有该单元 sync 权限。测试使用各操作 application/json.example 的请求。
  sequence:
  - beginUpload → 201；保留 uploadId。
  - findMissingObjects → 200，首次协商缺少 tree。
  - storeBatch → 200，8 字节空树内容已持久确认。
  - finalizeUpload → 200 published；故意丢弃回复，再次 finalizeUpload 得到逐字段相同回执。
  - listEntries(path 为空串、snapshotId 为刚发布 ID) → items=[]。
  - 从原基线 null 再发布另一个检查点 ID → fork，主线仍引用第一份快照。
