<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>心狐同步 · 文件阅读器</title>
<link rel="icon" href="/reader/xinhu.png"><link rel="stylesheet" href="/reader/reader.css">
<script defer src="/reader/reader.js"></script>
</head>
<body>
<header><div class="bar"><img src="/reader/xinhu.png" width="42" height="42" alt=""><strong>心狐同步</strong><span class="server">梦枢天罗</span><button id="logout" hidden>退出配对</button></div></header>
<main>
<section id="pair" hidden><h1>配对文件阅读器</h1><p>输入梦枢天罗管理员签发的只读配对码。</p>
<form id="pair-form"><label for="code">配对码</label><input id="code" type="password" autocomplete="off" spellcheck="false" required><button class="primary" type="submit">配对并查看</button></form></section>
<section id="library" hidden>
<nav aria-label="目录导航" id="crumbs"></nav><div class="toolbar"><h1 id="heading">资料库</h1><a class="download" id="archive" download hidden>下载项目 ZIP</a><button id="history" hidden>版本历史</button><button id="refresh">刷新</button></div>
<p id="meta"></p><div id="list"></div><button id="more" hidden>加载更多</button>
</section>
<section id="preview" hidden><div class="toolbar"><h2 id="filename"></h2><button id="close-preview">收起预览</button></div><p id="preview-note"></p><pre id="text"></pre></section>
<p id="status" role="status" aria-live="polite"></p>
</main></body></html>
